[Settings]
# Base GTK3 theme — we keep a clean, well-known base and layer our own
# mac-style tweaks on top via gtk.css (loaded automatically after the theme).
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=false

# WhiteSur (Big Sur) icons + cursors.
gtk-icon-theme-name=WhiteSur-light
gtk-cursor-theme-name=WhiteSur-cursors
gtk-cursor-theme-size=24
