[workspace]
resolver = "2"
members = [
    "crates/api-core",
    "crates/util-exec",
    "crates/util-eval",
    "crates/module-wifi",
    "crates/module-bluetooth",
    "crates/module-audio",
    "crates/module-backlight",
    "crates/module-battery",
    "crates/module-date",
    "crates/module-theme",
    "crates/module-dock",
    "crates/module-search",
    "crates/module-shot",
    "crates/module-spaces",
    "crates/module-bar",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
